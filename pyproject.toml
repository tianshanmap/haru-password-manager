[project]
name = "haru-password-manager"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.14.2",
    "cryptography>=49.0.0",
    "fastapi[standard]>=0.139.2",
    "psycopg[binary]>=3.3.4",
    "python-multipart>=0.0.32",
    "pywhatkit>=5.4",
]

[tool.setuptools.packages.find]
where = ["src"]
